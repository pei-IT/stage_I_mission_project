<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
</head>
<body>
    <div class="welcome">歡迎光臨，請註冊登入系統</div>
    
    <div class="container">
        <!-- 註冊表單 -->
        <form id="signupForm" method="POST" action="/signup">
            <div class="title">註冊帳號</div>            
            <div class="form-group">
                <label for="signup-name">姓名</label>                
                <input type="text" id="signup-name" name="name" required>                
            </div>
            <div class="form-group">
                <label for="signup-email">信箱</label>                
                <input type="text" id="signup-email" name="email" required>                
            </div>            
            <div class="form-group">
                <label for="signup-password">密碼</label>                
                <input type="password" id="signup-password" name="password" required>    
            </div>         
            <div class="button-group">
                <button type="submit" class="submit-btn">註冊</button>
            </div>            
        </form>
        
        <!-- 登入表單 -->
        <form id="loginForm" method="POST" action="/login">
            <div class="title">登入系統</div>
            <div class="form-group">
                <label for="login-email">信箱</label>                
                <input type="text" id="login-email" name="email" required>
            </div>
            <div class="form-group">
                <label for="login-password">密碼</label>                
                <input type="password" id="login-password" name="password" required>    
            </div> 
            <div class="button-group">
                <button type="submit" class="submit-btn">登入</button>
            </div>
        </form>
    </div>
    
    <script>
        // 註冊表單驗證
        const signupForm = document.getElementById('signupForm');
        signupForm.addEventListener('submit', function(event) {
            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
        });
        
        // 登入表單驗證
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', function(event) {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value.trim();          
        });
    </script>
</body>
</html>
