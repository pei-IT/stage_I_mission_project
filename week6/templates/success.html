<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Page</title>
    <link href="{{ url_for('static', path='/styles-success.css') }}" rel="stylesheet">
</head>
<body>
    <div class="welcome">歡迎光臨，這是會員頁</div>
    
    <div class="container">
        <div class="title">
            <span class="member-name">{{ member_name }}</span>，歡迎登入系統
        </div>
        <div class="logout">
            <a href="/logout">登出系統</a>
        </div>

        <!-- 留言表單 -->
        <form id="messageForm" method="POST" action="/createMessage">
            <div class="form-title">快來留言吧</div>     
            <div class="form-group">
                <label for="message-content">內容</label>                
                <input type="text" id="message-content" name="content" required>
            </div>             
            <div class="button-group">
                <button type="submit" class="submit-btn">送出</button>
            </div>
        </form>

        <!-- 顯示歷史留言 -->
        {% if messages %}
        <div class="messages-section">
            {% for message in messages %}
            <div class="message-line">
                {{ message.name }}：{{ message.content }}
                {% if message.member_id == member_id %}
                    <button class="delete-btn" onclick="confirmDelete({{ message.id }})">x</button>
                {% endif %}
            </div>
            {% endfor %}
        </div>
        {% endif %}
    </div>

    <!-- 隱藏刪除表單 -->
    <form id="deleteForm" method="POST" action="/deleteMessage" style="display:none;">
        <input type="hidden" name="message_id" value="">
    </form>

    <script>
        // 留言表單驗證
        const messageForm = document.getElementById('messageForm');
        messageForm.addEventListener('submit', function(event) {
            const content = document.getElementById('message-content').value.trim();
            if (!content) {
                event.preventDefault();
            }
        });
        // 確認後送出刪除
        function confirmDelete(id){
            const ok = confirm("確定要刪除嗎？");
            if(!ok) return;
            const form = document.getElementById("deleteForm");
            form.message_id.value = id;
            form.submit();
        }
    </script>
</body>
</html>
